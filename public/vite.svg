<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1c1d24" />
      <stop offset="55%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="accentSpotlight" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#0044ff" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#27272a" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#18181b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.6" />
    </linearGradient>

    <!-- Metallic Titanium Monogram Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F4F4F6" />
      <stop offset="70%" stop-color="#D4D4D8" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Colorist Hue Spectrum Bar Gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="28%" stop-color="#0072FF" />
      <stop offset="50%" stop-color="#9D00FF" />
      <stop offset="72%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- RGB Lift / Gamma / Gain Node Gradients -->
    <linearGradient id="cyanNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="magentaNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="amberNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow Filter for Monogram Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    
    <filter id="glowSubtle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Center Glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#accentSpotlight)" />

  <!-- Film Viewfinder Frame Corner Reticles -->
  <g stroke="#71717A" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <!-- Top-Left -->
    <path d="M 52 74 V 54 H 74" fill="none" />
    <!-- Top-Right -->
    <path d="M 460 74 V 54 H 438" fill="none" />
    <!-- Bottom-Left -->
    <path d="M 52 438 V 458 H 74" fill="none" />
    <!-- Bottom-Right -->
    <path d="M 460 438 V 458 H 438" fill="none" />
  </g>

  <!-- Monogram Glyph (MH) with Drop Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Left Pillar (M) -->
    <rect x="96" y="104" width="38" height="224" rx="8" fill="url(#metalGrad)" />

    <!-- Center V of M -->
    <path d="M 134 104 H 168 L 190 172 L 212 104 H 246 L 190 238 Z" fill="url(#metalGrad)" />

    <!-- Shared Middle Pillar (M + H) -->
    <rect x="246" y="104" width="38" height="224" rx="8" fill="url(#metalGrad)" />

    <!-- Crossbar of H -->
    <rect x="284" y="200" width="94" height="36" rx="5" fill="url(#metalGrad)" />

    <!-- Right Pillar (H) -->
    <rect x="378" y="104" width="38" height="224" rx="8" fill="url(#metalGrad)" />
  </g>

  <!-- Colorist Hue Calibration Spectrum Line -->
  <g filter="url(#glowSubtle)">
    <!-- Left line segment -->
    <line x1="96" y1="352" x2="192" y2="352" stroke="url(#spectrumGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- 3 Colorist Grading Wheels Calibration Nodes (Lift, Gamma, Gain) -->
    <circle cx="220" cy="352" r="5.5" fill="url(#cyanNode)" />
    <circle cx="256" cy="352" r="5.5" fill="url(#magentaNode)" />
    <circle cx="292" cy="352" r="5.5" fill="url(#amberNode)" />

    <!-- Right line segment -->
    <line x1="320" y1="352" x2="416" y2="352" stroke="url(#spectrumGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Studio Brand Typography -->
  <!-- MAHMOUD ABO HUSSEIN -->
  <text 
    x="256" 
    y="404" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="21" 
    font-weight="800" 
    letter-spacing="5"
  >MAHMOUD ABO HUSSEIN</text>

  <!-- CINEMATIC COLORIST -->
  <text 
    x="256" 
    y="432" 
    text-anchor="middle" 
    fill="#94A3B8" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="11.5" 
    font-weight="600" 
    letter-spacing="6"
  >CINEMATIC COLORIST</text>
</svg>